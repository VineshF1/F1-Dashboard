name: Fetch F1 Data
on:
  schedule:
    - cron: '30 18 * * 0'   # Sunday 18:30 UTC = Monday 12 AM IST
    - cron: '0 */4 * * *'    # Every 4 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'generate_data.py'
      - 'server.py'
      - '.github/workflows/fetch-data.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fetch-f1-data
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install fastf1 pandas requests beautifulsoup4 lxml

      - name: Generate data files
        run: python generate_data.py
        timeout-minutes: 25

      - name: Prepare Pages output
        run: |
          cp index.html data/index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./data

      - id: deployment
        uses: actions/deploy-pages@v4
