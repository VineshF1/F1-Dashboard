name: Keep Workflows Alive
on:
  schedule:
    - cron: '0 9 1 * *' # Monthly on the 1st at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-workflows-alive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Update keepalive timestamp (IST)
        run: |
          IST_NOW=$(TZ=Asia/Kolkata date +%Y-%m-%dT%H:%M:%S%z)
          # Insert colon into +0530 -> +05:30 for ISO 8601
          IST_NOW=$(echo "$IST_NOW" | sed -E 's/([+-][0-9]{2})([0-9]{2})$/\1:\2/')
          python3 - "$IST_NOW" <<'EOF'
          import json, sys
          path = ".github/keepalive.json"
          with open(path) as f:
              data = json.load(f)
          data["last-keepalive"] = sys.argv[1]
          data["timezone"] = "Asia/Kolkata"
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          print(f"Updated last-keepalive to {sys.argv[1]}")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.json
          git diff --quiet --cached || git commit -m "Chore: keep workflows alive"
          git push
